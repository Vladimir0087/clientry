name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Deploys the chosen branch; with deploy off it only publishes the image.
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Render and Netlify after the checks
        type: boolean
        default: true

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vladimir0087/clientry-api

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: shellcheck .github/scripts/*.sh

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test

  # The plan's scenarios in Chromium against production builds of the web and the API.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Not cached, as Playwright's CI guide advises: the system packages install either way, and
      # restoring the browser takes as long as downloading it.
      - run: pnpm --filter @clientry/e2e exec playwright install --with-deps --only-shell chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            apps/e2e/.logs
          include-hidden-files: true
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: clientry-api:local
          build-args: APP_VERSION=${{ github.sha }}
          # One plain image: the digest that passes the smoke test is the one Render runs.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate a throwaway signing key
        run: |
          key=$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 |
            awk 'NF { printf "%s\\n", $0 }')
          echo "JWT_PRIVATE_KEY=$key" >> "$GITHUB_ENV"

      - run: docker compose --profile full up -d --wait --no-build

      - run: bash .github/scripts/smoke-api-container.sh

      - if: failure()
        run: docker compose --profile full logs

      - name: Publish the tested image
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in "sha-$GITHUB_SHA" latest; do
            docker tag clientry-api:local "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$IMAGE:sha-$GITHUB_SHA" | grep "^$IMAGE@")
          echo "Published $reference"
          echo "digest=${reference#*@}" >> "$GITHUB_OUTPUT"

  deploy-api:
    needs: [lint, typecheck, test, e2e, image]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A running deploy always finishes; a newer waiting one replaces an older waiting one.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7

      # The digest, never a tag: Render runs exactly the image that passed the smoke test.
      - name: Deploy the image to Render
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST --url-query "imgURL=$IMAGE_REF" "$DEPLOY_HOOK_URL")
          cat response.json
          echo
          case $status in
            200) echo "Render started the deploy of $IMAGE_REF" ;;
            202) echo "Render queued the deploy of $IMAGE_REF behind a running one" ;;
            *)
              echo "::error::Render's deploy hook answered $status"
              exit 1
              ;;
          esac

      - run: bash .github/scripts/wait-for-api-version.sh "$API_PUBLIC_URL" "$GITHUB_SHA"

  # After the API, so a web build that calls a new endpoint never goes live before it.
  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      NETLIFY_CLI: netlify-cli@27.12.0
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v7

      # The throwaway API_URL and JWT_PUBLIC_KEY could shadow the site's own.
      - uses: ./.github/actions/setup
        with:
          web-env: 'false'

      # Builds, uploads and publishes; a failed build publishes nothing. pnpm's dlx needs
      # --package for a package with two binaries.
      - run: >-
          pnpm --package="$NETLIFY_CLI" dlx netlify deploy --prod --context production
          --filter @clientry/web --message "$GITHUB_SHA"

      # No commit: deploy-api checked it, and a newer run's deploy-api may already serve a later one.
      - run: bash .github/scripts/smoke-live.sh "$WEB_PUBLIC_URL" "$API_PUBLIC_URL"
        env:
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}

      - run: pnpm --filter @clientry/e2e exec playwright install --with-deps --only-shell chromium

      # A read-only tour of the live demo; its own session ends with its logout.
      - id: live-tour
        run: pnpm --filter @clientry/e2e e2e:live
        env:
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}

      - if: failure() && steps.live-tour.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: live-tour-trace
          path: apps/e2e/test-results
          retention-days: 7
