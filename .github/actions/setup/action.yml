name: Setup
description: Node from .nvmrc, pnpm from packageManager, cached store and frozen install

inputs:
  web-env:
    description: Export a throwaway API_URL and JWT_PUBLIC_KEY; off where the real ones are pulled
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        HUSKY: 0

    # next.config.ts needs both, and only deploy-web gets the real ones; the private key is discarded.
    - if: inputs.web-env == 'true'
      run: |
        echo "API_URL=http://127.0.0.1:4000" >> "$GITHUB_ENV"
        pnpm --silent --filter @clientry/api jwt:keygen | grep '^JWT_PUBLIC_KEY=' >> "$GITHUB_ENV"
      shell: bash
