name: Setup
description: Node from .nvmrc, pnpm from packageManager, cached store and frozen install

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        HUSKY: 0
