name: Setup
description: Node from .nvmrc, pnpm from packageManager, cached store and frozen install

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        HUSKY: 0

    # Every job loads next.config.ts, which needs both; the private half of the key is discarded.
    - run: |
        echo "API_URL=http://127.0.0.1:4000" >> "$GITHUB_ENV"
        pnpm --silent --filter @clientry/api jwt:keygen | grep '^JWT_PUBLIC_KEY=' >> "$GITHUB_ENV"
      shell: bash
